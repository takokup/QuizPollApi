services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development      
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=quizpoll;Username=quizpoll;Password=quizpoll_dev"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Database__AutoCreate: "true"
      Captcha__Enabled: "false"                 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizpoll
      POSTGRES_USER: quizpoll
      POSTGRES_PASSWORD: quizpoll_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizpoll -d quizpoll"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
